project:
  name: elevator-ads-mvp
  repoPath: /home/caioh/ai-lab/elevator-ads-mvp
  defaultBranch: main

workItems:
  provider: github
  repo: caiohomem/elevator-ads-mvp
  readyLabel: agent-ready
  workingLabel: agent-working
  reviewLabel: agent-review
  pausedLabel: agent-paused
  blockedLabel: agent-blocked
  failedLabel: agent-failed

planner:
  provider: claude-cli
  command: claude
  model: claude-sonnet-4-6

executor:
  provider: codex-cli
  command: codex
  sandbox: workspace-write
  approval: never

tests:
  commands:
    - dotnet test /home/caioh/ai-lab/elevator-ads-mvp/backend/ElevatorAds.sln
    - npm --prefix frontend/elevator-ads-admin run build

safety:
  maxFilesChanged: 100
  forbiddenPaths:
    - .env
    - .env.local
    - .env.production
    - appsettings.Production.json
    - secrets/
  autoMergeAfterChecks: true
  autoMergeMethod: squash

quota:
  retryAfterHours: 5
  quotaPatterns:
    - usage limit
    - rate limit
    - quota exceeded
    - try again later
    - limit reached
    - too many requests

database:
  provider: postgresql
  connectionString: Host=postgres;Port=5432;Database=agent_foreman;Username=agent_foreman;Password=agent_foreman

daemon:
  pollIntervalSeconds: 30
