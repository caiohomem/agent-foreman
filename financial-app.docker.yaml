project:
  name: financial-app
  repoPath: /workspace/financial-app
  defaultBranch: main

workItems:
  provider: github
  repo: caiohomem/financial-app
  readyLabel: agent-ready
  workingLabel: agent-working
  reviewLabel: agent-review
  pausedLabel: agent-paused
  blockedLabel: agent-blocked
  failedLabel: agent-failed

planner:
  provider: claude-cli
  command: claude
  model: claude-sonnet-4-6

executor:
  provider: codex-cli
  command: codex
  sandbox: workspace-write
  approval: never

tests:
  commands: []

safety:
  maxFilesChanged: 100
  autoMergeAfterChecks: true
  autoMergeMethod: squash
  forbiddenPaths:
    - .env
    - .env.local
    - .env.production
    - appsettings.Production.json
    - secrets/

quota:
  retryAfterHours: 5
  quotaPatterns:
    - usage limit
    - rate limit
    - quota exceeded
    - try again later
    - limit reached
    - too many requests

database:
  provider: postgresql
  connectionString: Host=postgres;Port=5432;Database=agent_foreman_financial_app;Username=agent_foreman;Password=agent_foreman

daemon:
  pollIntervalSeconds: 30
